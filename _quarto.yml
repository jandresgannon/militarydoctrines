project:
  type: website
  resources:
    - CNAME
    - content/data_copy/**

website:
  site-url: "https://militarydoctrines.com"
  navbar: true
  title: "Military Doctrines"
  favicon: favicon.ico
  bread-crumbs: true

  page-footer:
    right: "This website is built with [Quarto](https://quarto.org/) by Isabel Arvelo, Andres Gannon, and Alexandra Sniezek."
    left: "&copy; CC-1.0"

  sidebar:
    background: "#D9E3E4"
    pinned: true
    align: center

    style: "docked"
    search: true
    collapse-level: 2
    contents:
      - href: index.qmd
        text: Home
      - href: content/data.qmd
        text: Data
      - href: content/codebook.qmd
        text: Codebook
      - href: content/changelog.qmd
        text: Changelog
      - href: content/Papers.qmd
        text: Paper
      - href: content/about.qmd
        text: About

format:
  html:
    theme:
      light: [simplex, theme.scss]
      dark: [simplex, theme-dark.scss]

filters:
  - include-files.lua
  - quarto

execute:
  freeze: false